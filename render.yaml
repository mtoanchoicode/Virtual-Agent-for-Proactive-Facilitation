services:
  - type: web
    name: iacine-virtual-avatar-backend
    runtime: python
    rootDir: back
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    envVars:
      - key: OPENAI_API_KEY
        sync: false          # Secret — set manually in Render dashboard
      - key: CORS_ORIGINS
        sync: false          # Set to your Vercel URL, e.g. https://your-app.vercel.app
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: ENABLE_FILE_LOGGING
        value: "false"       # Disable file logging on server (no persistent disk on free tier)
